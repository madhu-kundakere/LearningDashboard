name: LearningDashboard
options:
  bundleIdPrefix: com.example.learningdashboard
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
packages:
  LearningKit:
    path: Packages/LearningKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LearningDashboard:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: LearningKit
        products: [Core, Domain, Networking, MockBackend, Persistence, DataLayer, DesignSystem, AuthFeature, CoursesFeature]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Learning
        CFBundleLocalizations: [en, de]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.learningdashboard.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LearningDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: LearningDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.learningdashboard.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  LearningDashboard:
    build:
      targets:
        LearningDashboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LearningKit/DomainTests
        - package: LearningKit/DataLayerTests
        - package: LearningKit/AuthFeatureTests
        - package: LearningKit/CoursesFeatureTests
        - LearningDashboardUITests
